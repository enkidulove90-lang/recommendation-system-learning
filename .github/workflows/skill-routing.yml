name: Skill Routing Check

# Skill 路由治理（AGENTS.md「Skill 管理与路由」章节）：
# 校验 config/skill_registry.yaml 的路由有效性（规范路径存在、入口与验证命令齐备）、
# IDE 本地目录只有指针 stub、废弃技能归档不可执行、AGENTS.md 无失效仓库相对链接。
# ID 冲突/孤儿技能/用户级重复都会被 SkillManager.validate() 判红。

on:
  push:
    paths:
      - "config/skill_registry.yaml"
      - ".agents/skills/**"
      - ".claude/skills/**"
      - "redbook/services/skill_manager.py"
      - "redbook/tests/test_skill_routing.py"
      - "AGENTS.md"
  pull_request:
  schedule:
    - cron: "37 3 * * 1"   # 每周一兜底巡检（失效链接/废弃命令漂移）

jobs:
  skill-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install pyyaml pytest
      - name: Validate skill routing (registry + pointers + archive + AGENTS.md links)
        run: python -m pytest redbook/tests/test_skill_routing.py -q
