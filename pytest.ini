# 根级 pytest 配置：basetemp 指向仓库本地，规避全局 Temp\pytest-of-lkshpc 权限损坏
# （2026-11-22 整改 P0-1，沿用 ada 分支先例；各子目录 pytest.ini 同步加 basetemp）
[pytest]
addopts = --basetemp=.pytest_tmp -p no:cacheprovider
testpaths =
    content_events/tests
    content_factory/tests
    paper_monitor/tests
    redbook
    tests
    wechat_design/dtle/tests
python_files = test_*.py
# -p no:cacheprovider：仓库内 .pytest_cache 曾被权限损坏锁死（WinError 5），
# 禁用缓存写入以规避；目录待手动以管理员身份删除后可移除该项
