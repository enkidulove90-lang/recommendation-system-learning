slug: '3773078.3831765'
title: 【RecSys 2026】偏好不是一个点
status: draft
source: content_composer
parsed_dir: data/parsed/gateboxgcn
pdf_path: ''
body: |-
  📌 解决什么问题
  主流推荐把用户和物品都压成向量空间里的一个点，可真实偏好常常是个范围：预算两千到五千日元、颜色不只蓝色也行。Box 嵌入用超矩形（中心 + 偏移）来装这种不确定性，但现有 Box 方法都要求偏移量为正，因为负偏移会让盒子的几何定义失效。
  结果就是模型不管信息够不够，都必须给出一个盒子：交互很稀疏、这一维根本没观测到、或者干脆是噪声的时候，这些不可靠维度照样参与打分。

  ✨ 创新点/贡献
  · 允许偏移取负，并把负维度显式定义为“不可评估维度”：不再假装它是偏好范围，而是承认这一维没信息。
  · 前向硬门控 + 反向软门控：前向把不可评估维度整维剔除，只用可靠维度算偏好分；反向仍给这些维度回传梯度，门控和 box 表示一起端到端训练。
  · 带符号的偏好打分：重叠记正、分离记负，把距离当惩罚项，不再依赖“体积”这个非负量。
  · 把 box 学习接进 GCN：center 和 offset 分别沿用户—物品图传播聚合，并处理偏好的方向性。

  🧪 Benchmark
  论文报告：四个数据集——Yelp、Amazon Pet Supplies、MovieLens 1M、KuaiRec。
  对比方法：GCN 系（LightGCN、LR-GCCF、IMP-GCN、RAGCN、LayerGCN、NLGCL）与 Box 系（BoxGNN、L_LCD-UC），另有 MF、NGCF 等。
  指标：Recall@20、NDCG@20。

  ⚙️ 实验条件
  论文报告：Yelp / Amazon 维度 D=256，MovieLens / KuaiRec 沿用前作取 D=64；center 和 offset 用高斯初始化（均值 0、标准差 1e-2）；学习率 1e-4、L2 系数 1e-4，在各自验证集上调。
  数据切分：按时间取最早 70% 训练、最近 20% 测试、剩余 10% 调参；Yelp 与 Amazon 过滤交互数少于 15 的用户、少于 10 的物品，稀疏度分别为 99.90% 和 99.83%。

  📊 效果
  论文报告（R@20 / N@20，相对最优基线）：
  · Yelp 0.0789 / 0.0500，+5.76% / +6.16%
  · Amazon 0.0733 / 0.0457，+6.39% / +8.04%
  · MovieLens 0.1142 / 0.1235，+6.63% / +13.20%
  · KuaiRec 0.1190 / 0.3671，+33.11% / +35.56%
  负偏移确实被用上了：Yelp 有 19.86%、Amazon 有 12.45% 的偏移维度小于 0。
  消融（Yelp R@20）：去掉软门控 0.0774、完全去掉门控改强制正偏移 0.0769、换 Gumbel 打分 0.0775、换体积打分 0.0744，都低于完整的 0.0789。

