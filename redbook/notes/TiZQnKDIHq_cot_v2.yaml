title: 题目越难，CoT 越决定答案
status: published
source: handwritten
parsed_dir: data/parsed/openreview_TiZQnKDIHq
pdf_path: data/parsed/openreview_TiZQnKDIHq/lb_cot_main.pdf
body: |-
  🎓 模型写的推理过程（CoT），到底是给它自己看的草稿，还是真的决定了答案？TMLR 这篇新论文给了一个测因果的办法，结论是：看题目难不难。

  🧠 它想解决什么
  现在很多产品拿 CoT 当监控，看模型怎么一步步推。前提是：写出来的链得真的在影响答案；否则你监控的只是一段「事后编的解释」。而这个前提，以前没人量过。

  ✨ 怎么测的
  思路很朴素，像做对照实验：
  1. 找一道模型本来能答对、且会写多步推理的题；
  2. 把中间某一步（推理链的 25%、50%、75% 处）故意改错；
  3. 从错的地方把链截断，让它接着写；
  4. 看最后的答案：是被带跑偏了，还是自己纠回来了。
  结果分三种：43.0% 被带跑偏（跟着错的算下去）、18.3% 自己纠回来、38.7% 干脆无视那处改动。

  📊 四个关键数字
  1. 题目越难，CoT 越「算数」。Gemma 在 29 个 MMLU 学科上，被带跑偏的比例从 7.5%（心理学）升到 53.7%（全球常识）；换成 GSM8K→BBH 这组题、同一套改法，则从 22% 升到 41%。
  2. 起作用的是「难度」，不是「怎么改」。只改数字类错误时，题目变难会让带跑偏率涨 16 倍；对 28,584 条数据做归因，难度能解释 98.8% 的差异，改动方式只占 0.8%。
  3. 用推理 RL 训过的模型（DeepSeek-R1-Distill）更不容易被带跑偏，难度造成的差距也被压平，更多是自己纠回来。
  4. 结论经得起查。换 4 种判官提示结果不变；两位标注者盲标 500 条，在「是否被带跑偏」上每条都一致。

  💡 对我们的意义
  CoT 监控只在「这题对模型够难」时才有效，简单题上它可能只是装饰；同一套规则，对不同水平的模型要重新校准。另外想用激活引导直接改这条链，这篇实验里没改成。

  ⚠️ 局限：只做了 3 个 8B 级模型、3 个基准；也只测了「推理链→答案」这个方向，不代表这条链能反映模型内部真实的计算。

  📄 论文（TMLR 2026-09-18）：https://openreview.net/forum?id=TiZQnKDIHq
  💻 代码：https://github.com/r2m-ai/load-bearing-cot
  ✨ 关注我，持续拆解大模型 / Agent 最新论文 📚
