title: 16格记忆扛住长序列推荐
status: draft
source: handwritten
parsed_dir: data/parsed/2611.17921_recmem
pdf_path: data/papers/2611.17921_RecMem.pdf
body: |-
  🎓 用户有几千次历史，生成式推荐还要每次从头读吗？RecMem 想解决的正是这笔会随历史长度线性膨胀的推理账单。

  ✨ 它不靠简单截断，也不是先检索再拼上下文：把较早的交互逐段压进固定数量的记忆槽，让记忆状态和解码上下文都不随历史变长。最近行为保留在上下文里，远期行为变成可更新的“长期记忆”。

  🧠 关键做法是 16 个有状态记忆槽。每个历史片段进来时，槽位用遗忘门决定保留多少旧信息、写入多少新信息；解码器读取“16 个槽位 + 最近 200 个行为”，总共 216 token。图 1 把这条更新、训练和预测链路画得很清楚。

  📊 MerRec 标准协议下，RecMem-Stream 的 Recall@10 / Recall@200 是 42.36 / 72.20；HSTU-1200 是 48.18 / 74.44。换成摘要里的相对说法：16 槽、216 token 仍保留约 87.9% 的 Recall@10 与 97.0% 的 Recall@200。

  🧪 更有意思的是它不只报“压得小”：论文把空间不变性、语义保真、终身可演化写成约束，并给出与历史长度无关的状态差异界，来保证顺序更新和把片段打包更新的一致性。固定 16 槽跑到 1 万次交互，Recall@200 曲线没有明显塌陷。

  💡 如果你的瓶颈是“用户历史长度主导推理成本”，这是一条值得关注的路线：把算力从不断拉长上下文，转为维护一个受控、可演化的状态。

  💻 代码状态：论文 arXiv 页面暂未列出官方 GitHub 仓库。

  ⚠️ 局限
  结论来自 MerRec 的离线实验和 HSTU 系列骨干；跨数据集、线上服务开销与其他骨干的迁移效果仍待验证。

  📎 论文：https://arxiv.org/abs/2611.17921
