paper_id: '2606.00422'
slug: '2606.00422'
title: 召回+排序合成一个模型，延迟降11%
status: published
source: handwritten
parsed_dir: data/parsed/2606.00422
pdf_path: data/parsed/2606.00422/2606.00422_origin.pdf
body: |-
  🎓 一句话：召回要给上百万候选快速打分，排序只对几百个候选做更贵的交叉计算——算法形态不同，但两边编码的是同一份用户行为历史。Pinterest 把它们合进一个模型（输入、训练、服务一起统一，此前只统过主干）：线上互动 +1%，延迟 −11.1%，QPS +63.6%。

  ✨ 三个改动（看图 1）
  ① 动作编成 multi-hot 拼到特征维、不插 token（长度与召回一致）；历史动作 20% 随机 mask、候选恒 mask，用每类动作一个 MLP 头做 BCE。
  ② 每条样本 = 过去行为序列 + 未来一次请求的完整曝光 slate（未交互曝光保 10%）：召回的正样本、排序的负样本一次都有了。
  ③ 历史的 O(n²) 自注意力只在召回侧 prefill 一次，KV 经 CUDA IPC 给排序复用（只做 O(n·k) decode）；Faiss 一次调用同时返回候选 ID 与 item 嵌入。

  📊 结果
  • 离线：排序 Hit@3 0.10096，比生产排序模型 TransActV2+DCNv2（0.08801）高 14.7%，也高于等长 HSTU（0.09733）；召回 Recall@10 0.7766 与 PinRec 持平。
  • 消融：只训排序 0.09735 已超 HSTU 与生产排序模型，加回召回目标到 0.10096；先训召回再微调仅 0.09587（embedder 须冻结）。
  • 效率：KV 复用让排序从 prefill 变 decode，单次前向 ≈2.4×，叠 flex attention+fp8 最高 3.92×（线上实际用 bf16）。

  ⚠️ 局限
  ① 线上只替换召回 + 粗排，下游原精排未动，离线 14.7% 的优势落到线上只剩约 1% 互动提升；
  ② fp8 把 QPS 推到 +109.1%，但量化使离线指标掉 0.5%、延迟反而 +6.7%，线上仍用 bf16；
  ③ 只在 Pinterest 两个场景验证，未开源。

  📄 论文：https://arxiv.org/abs/2606.00422
  💻 相关开源：github.com/pinterest/transformer_user_action、github.com/meta-recsys/generative-recommenders
  ✨ 关注我，持续拆解推荐系统论文 📚
figures:
- file: images/fig_unipinrec_flat.png
  type: architecture
  description: 论文主架构图（Figure 2）：Data Layer 把用户历史行为（Pin/Action/Search Query/Board）与未来曝光位（未来 feedview + 展示未点击的负样本）都编码进同一条序列，训练时对 20% 历史行为做随机掩码；Model Layer 用一条 GPT2 主干（自定义 mask 关闭未来位置之间的互相注意），分成 pin decoder（Sampled Softmax，负责召回）与 action decoder（BCE，负责排序）两个头；右上角是因果下三角注意力掩码的可视化。
- file: images/fig_comparison_table_slim.png
  type: framework
  description: 论文对比图（Figure 1）：把「统一到哪一层」拆成输入格式 / 架构 / 训练 / 服务四个维度，对比 HSTU（只统一架构：2 种输入格式、共享主干但要两次前向、分开训练、两个独立服务）、OneRec（端到端生成式，但训练是多阶段流水线、且与既有服务栈不兼容）与 UniPinRec（1 种输入格式、1 次 prefill + 2 次 decode、单阶段联合损失、可直接替换原服务栈并复用计算）。
- file: images/fig_serve_diagram.png
  type: framework
  description: 线上服务拓扑图（Figure 3）：召回与排序是两个独立 Triton 节点，中间是 CPU 上的 Faiss 索引。ANN 检索同时返回候选 Pin ID 和重建后的物品向量（省掉排序阶段单独取 embedding 的一次开销）；召回阶段算好的用户历史 KV 缓存在共享内存里直接给排序阶段复用（图左上 Shared KV Cache → Past Sequence KV → Ranking Inference）。
- file: images/fig_card_online.png
  type: custom_card
  description: 自制数字卡（标注为自制）：把论文 Table 5（Board More Ideas）与 Table 6（通知）的线上 A/B 结果整理成手机可读版。
- file: images/fig_card_efficiency.png
  type: custom_card
  description: 自制数字卡（标注为自制）：端到端延迟与 QPS 的线上收益，以及单次排序前向 3.92× 的三层来源（KV 缓存复用 / fp8+CUDA graph / flex attention），附 fp8 的延迟-QPS 权衡说明。
- file: images/fig_scaling_flops.png
  type: result
  description: 容量扩展实验（Figure 4）：Hit@3 随相对 FLOPs 的变化，两条轴分别是加深层数（L=2→24，序列长固定 1024）与加长序列（S=256→2K，层数固定 12）。两条曲线都还在涨，说明模型未饱和；但深度随算力线性增长，序列长度是注意力的平方开销。
