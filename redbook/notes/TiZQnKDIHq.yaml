title: CoT 从装饰到承重：越难越关键
status: published
source: handwritten
parsed_dir: data/parsed/openreview_TiZQnKDIHq
pdf_path: data/parsed/openreview_TiZQnKDIHq/lb_cot_main.pdf
body: |-
  🎓 一句话：模型写出来的推理链，是「解释给人看」，还是真的在决定答案？这篇 TMLR 新论文给了因果测法——看难度。

  🧠 解决什么问题
  拿 CoT 做监控，前提是写出来的链因果上约束了答案，但这个约束有多强，一直没人量过。（它测的是 CoT→答案这一向，不涉及「CoT 是否反映内部计算」。）

  ✨ 怎么测的
  取正确多步 CoT → 切成步 → 在链的 25%/50%/75% 处扰动一步 → 在该处截断 → 让模型续写 → 比最终答案。三种行为：silent bypass 38.7%、self-correction 18.3%、error propagation 43.0%（判官校正后 45.3%/26.9%/27.8%）。

  📊 四个关键数字
  1. 难度梯度：Gemma 在 29 个 MMLU 学科上，误差传播率从 7.5%（高中心理）连续升到 53.7%（全球事实）；同一套文本策略下 GSM8K→BBH 从 22% 升到 41%。
  2. 谁在主导：固定扰动类型（数值）后，难度上来误差传播涨 16 倍；n=28,584 条续写的方差分解把 98.8% 的解释偏差归给难度，扰动类型只占 0.8%。
  3. 推理 RL 的影响：DeepSeek-R1-Distill 把误差传播整体压低、梯度被压扁，非传播侧更多转向自我纠正。
  4. 验证强度：判官提示换 4 个变体，error propagation 不变、C 率完全一致；n=500 双人盲标在 C-vs-non-C 上每行都一致（κ=1.00）。

  💡 给用 CoT 的人
  推理链只在「承重区」才值得当监控信号，而且要按「模型相对难度」校准——同一个任务，对强模型是装饰，对弱模型可能承重。想直接改这条链（激活引导）在本文实验里改不动。

  ⚠️ 局限：只测 CoT→答案方向；3 个 8B 级模型、3 个基准；行为标签仍有余留主观性。

  📄 论文（TMLR 2026-09-18）：https://openreview.net/forum?id=TiZQnKDIHq
  💻 代码：https://github.com/r2m-ai/load-bearing-cot
  ✨ 关注我，持续拆解大模型 / Agent 最新论文 📚
figures:
- file: images/fig_method_flow.png
  type: architecture
  description: 'Continuation-based causal testing pipeline: faithful baseline (correct answer + multi-step CoT) -> parse CoT into steps -> perturb one step (at 25/50/75% through the chain) -> truncate at the perturbed step -> continue generation from the corrupted prefix -> compare final answers. Three behavioural modes: silent bypass 38.7% / self-correction 18.3% / error propagation 43.0% (rule-based; judge-corrected 45.3% / 26.9% / 27.8%).'
- file: images/fig_difficulty_gradient.png
  type: result
  description: 'The decorative-to-load-bearing transition at subject-level resolution. Blue circles = 29 MMLU subjects (Gemma-2-9B-IT); diamond/triangle/square = dataset averages for Gemma, Llama-3.1-8B-Instruct and DeepSeek-R1-Distill-Qwen-7B. Error-propagation rate rises continuously as base accuracy falls: Gemma spans 7.5% (HS psychology) to 53.7% (global facts); shaded bands mark the CoT-causal (pink) and CoT-decorative (purple) regimes.'
- file: images/fig_judge_sensitivity.png
  type: result
  description: 'Judge prompt sensitivity. Left: four prompt variants shift the A/B boundary by an order of magnitude but leave error propagation (red) unchanged. Right: dataset-level C rates are identical across variants.'
- file: images/fig_human_agreement.png
  type: result
  description: 'The n=500 two-annotator blind study: per-source agreement of the human consensus with the production label, three-way (A/B/C) and binary (C vs non-C), with 95% Wilson CIs and per-source inter-annotator kappa. Annotators agree on the C-vs-non-C split on every row (kappa = 1.00, versus 0.93 on the three-way label).'
- file: images/fig_layer_sweep.png
  type: result
  description: 'Layer-wise probe accuracy across all 42 layers of Gemma-2-9B-IT (N = 2,000, grouped 5-fold CV, judge labels). 3-class probe: MLP 75.3% vs linear ~7pp lower (chance 33%); bypass probe ~80% (chance 50%); error-propagation probe also reported.'
- file: images/fig_steering.png
  type: result
  description: 'Single-direction activation steering at layer 21: per-type error rate under the error-propagation direction (coloured) and a random direction (grey dashed), alpha in [-10, +10], 95% Wilson CIs, n = 66 per type per alpha. The probe and random traces overlap, i.e. the null is not direction-specific.'
